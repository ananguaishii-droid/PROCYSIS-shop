<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCYSIS SHOP - Cloud Phone Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: bold; color: #38bdf8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .device-name { font-size: 18px; font-weight: bold; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .online { background-color: #059669; color: #ecfdf5; }
        .offline { background-color: #dc2626; color: #fef2f2; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; color: #94a3b8; }
        input { background-color: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 6px; font-size: 14px; }
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-primary { background-color: #0284c7; color: white; }
        .btn-primary:hover { background-color: #0369a1; }
        .btn-secondary { background-color: #334155; color: white; }
        .btn-secondary:hover { background-color: #475569; }
        .btn-open { background-color: #16a34a; color: white; width: 100%; text-align: center; text-decoration: none; display: block; padding: 12px; border-radius: 6px; font-weight: bold; }
        .btn-open:hover { background-color: #15803d; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">⚡ PROCYSIS SHOP - Cloud Phone Manager</div>
    </div>

    <div class="grid" id="deviceContainer"></div>

    <script>
        const devices = [
            { id: 1, name: "VIP-13" },
            { id: 2, name: "VIP-14" },
            { id: 3, name: "VIP-15" },
            { id: 4, name: "VIP-16" }
        ];

        function renderDevices() {
            const container = document.getElementById('deviceContainer');
            container.innerHTML = '';

            devices.forEach(dev => {
                const savedCode = localStorage.getItem(`code_${dev.id}`) || '';
                const savedLink = localStorage.getItem(`link_${dev.id}`) || '';
                const isOnline = localStorage.getItem(`status_${dev.id}`) !== 'offline';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="device-name">📱 ${dev.name}</span>
                        <span class="status-badge ${isOnline ? 'online' : 'offline'}" onclick="toggleStatus(${dev.id})">
                            ${isOnline ? '🟢 Online' : '🔴 Offline'}
                        </span>
                    </div>

                    <div class="input-group">
                        <label>รหัสสิทธิ์ (Auth Code / Link):</label>
                        <input type="text" id="input_${dev.id}" value="${savedCode}" placeholder="เช่น MRz7gSwauD หรือ ลิงก์">
                    </div>

                    <div class="btn-group">
                        <button class="btn-primary" onclick="saveData(${dev.id})">💾 บันทึก</button>
                        <button class="btn-secondary" onclick="copyCode(${dev.id})">📋 คัดลอกรหัส</button>
                    </div>

                    <a id="open_btn_${dev.id}" href="${savedLink || '#'}" target="_blank" class="btn-open" style="display: ${savedLink ? 'block' : 'none'};">
                        🚀 เปิดหน้าจอ Cloud Phone
                    </a>
                `;
                container.appendChild(card);
            });
        }

        function saveData(id) {
            const val = document.getElementById(`input_${id}`).value.trim();
            localStorage.setItem(`code_${id}`, val);

            let openUrl = val;
            if (val && !val.startsWith('http://') && !val.startsWith('https://')) {
                openUrl = `https://www.cloudemulator.net/app/phone`;
            }

            localStorage.setItem(`link_${id}`, openUrl);
            alert(`บันทึกข้อมูล ${id} เรียบร้อยแล้ว!`);
            renderDevices();
        }

        function copyCode(id) {
            const val = document.getElementById(`input_${id}`).value;
            if(!val) return alert('ยังไม่มีข้อมูลรหัสให้คัดลอก');
            navigator.clipboard.writeText(val);
            alert('คัดลอกรหัสเรียบร้อยแล้ว!');
        }

        function toggleStatus(id) {
            const current = localStorage.getItem(`status_${id}`);
            const next = current === 'offline' ? 'online' : 'offline';
            localStorage.setItem(`status_${id}`, next);
            renderDevices();
        }

        renderDevices();
    </script>
</body>
</html>
