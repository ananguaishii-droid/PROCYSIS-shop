<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCYSIS SHOP - Live Cloud Manager v5.3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0e14; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .card-bg { background-color: #161b22; border: 1px solid #30363d; }
        .card-bg:hover { border-color: #00f2fe; }
        .btn-blue { background-color: #1f6feb; color: white; }
        .btn-blue:hover { background-color: #388bfd; }
        .btn-dark { background-color: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .btn-dark:hover { background-color: #30363d; }
        .btn-red { background-color: #490202; color: #ff7b72; border: 1px solid #7d1a1a; }
        .btn-red:hover { background-color: #6e1111; }
        .glow-text { text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
    </style>
</head>
<body class="p-3 md:p-6 min-h-screen">

    <!-- Header / Navbar -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-4 mb-6 border-b border-gray-800 gap-3">
        <div class="flex items-center gap-3">
            <h1 class="text-xl md:text-2xl font-bold text-cyan-400 glow-text flex items-center gap-2">
                <i class="fa-solid fa-star text-amber-400"></i> PROCYSIS SHOP <span class="text-xs text-gray-500 font-normal">v5.3.0</span>
            </h1>
            <span class="bg-emerald-950/80 text-emerald-400 border border-emerald-800 text-xs px-2.5 py-1 rounded-full flex items-center gap-1.5 font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 4/4 เครื่องออนไลน์
            </span>
        </div>
        
        <div class="flex items-center gap-2 w-full sm:w-auto">
            <button onclick="batchAction('Start')" class="btn-blue text-xs px-3 py-2 rounded font-medium flex-1 sm:flex-none flex items-center justify-center gap-1">
                <i class="fa-solid fa-play"></i> Start ทั้งหมด
            </button>
            <button onclick="batchAction('Stop')" class="btn-dark text-xs px-3 py-2 rounded font-medium flex-1 sm:flex-none flex items-center justify-center gap-1">
                <i class="fa-solid fa-square"></i> Stop ทั้งหมด
            </button>
            <button onclick="batchAction('Rejoin')" class="btn-dark text-xs px-3 py-2 rounded font-medium flex-1 sm:flex-none flex items-center justify-center gap-1">
                <i class="fa-solid fa-rotate-right"></i> Rejoin
            </button>
        </div>
    </header>

    <!-- Notification Toast -->
    <div id="toast" class="hidden fixed top-4 right-4 bg-cyan-950 border border-cyan-500 text-cyan-200 px-4 py-2.5 rounded-lg shadow-xl text-sm z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-cyan-400"></i> <span id="toast-msg">ดำเนินการสำเร็จ</span>
    </div>

    <!-- Devices Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-5">
        
        <!-- Device Card 1 -->
        <div class="card-bg rounded-xl p-4 shadow-lg flex flex-col justify-between">
            <div>
                <!-- Card Header -->
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-400 inline-block"></span>
                        <h2 class="font-bold text-white text-base">MINI (หน้ากลาง)</h2>
                    </div>
                    <div class="flex gap-2">
                        <span class="bg-emerald-950 text-emerald-400 text-xs px-2 py-0.5 rounded border border-emerald-800">Tool running</span>
                        <span class="bg-emerald-950 text-emerald-400 text-xs px-2 py-0.5 rounded border border-emerald-800">Online</span>
                    </div>
                </div>

                <!-- Screen Display Area -->
                <div class="relative w-full bg-black rounded-lg overflow-hidden border border-gray-800 aspect-video mb-3 flex items-center justify-center group">
                    <canvas id="canvas-1" class="w-full h-full object-contain"></canvas>
                    <iframe id="iframe-1" class="hidden w-full h-full border-0"></iframe>
                    
                    <div class="absolute top-2 left-2 bg-black/70 text-[10px] text-gray-300 px-2 py-0.5 rounded border border-gray-700">
                        FPS: <span id="fps-1" class="text-emerald-400">30</span>
                    </div>
                    <button onclick="changeSource(1)" class="absolute top-2 right-2 bg-gray-900/80 hover:bg-black text-xs text-gray-300 px-2 py-1 rounded border border-gray-700 opacity-80 hover:opacity-100">
                        <i class="fa-solid fa-link text-cyan-400 mr-1"></i> ตั้งค่า Stream URL
                    </button>
                </div>

                <!-- Stats Bar -->
                <div class="grid grid-cols-5 gap-1 text-center bg-gray-900/60 p-2 rounded-lg border border-gray-800/80 mb-3 text-xs">
                    <div><div class="text-gray-400 text-[10px]">เวลา</div><div class="font-semibold text-white">3h 02m</div></div>
                    <div><div class="text-gray-400 text-[10px]">Online</div><div class="font-semibold text-emerald-400">7</div></div>
                    <div><div class="text-gray-400 text-[10px]">Offline</div><div class="font-semibold text-gray-400">0</div></div>
                    <div><div class="text-gray-400 text-[10px]">Rejoin</div><div class="font-semibold text-amber-400">14</div></div>
                    <div><div class="text-gray-400 text-[10px]">Hop</div><div class="font-semibold text-cyan-400">0</div></div>
                </div>
            </div>

            <!-- Controls -->
            <div class="space-y-2 text-xs">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="triggerTool(1, 'Start')" class="btn-blue py-2 rounded font-medium flex items-center justify-center gap-1"><i class="fa-solid fa-play"></i> Start tool</button>
                    <button onclick="triggerTool(1, 'Stop')" class="btn-dark py-2 rounded font-medium flex items-center justify-center gap-1"><i class="fa-solid fa-square"></i> Stop tool</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="triggerTool(1, 'Rejoin')" class="btn-dark py-2 rounded flex items-center justify-center gap-1"><i class="fa-solid fa-arrows-rotate"></i> Rejoin all</button>
                    <button onclick="openCookieModal(1)" class="btn-dark py-2 rounded flex items-center justify-center gap-1"><i class="fa-solid fa-cookie"></i> + Add cookies</button>
                </div>
                <button onclick="triggerTool(1, 'Reboot')" class="w-full btn-red py-2 rounded font-medium flex items-center justify-center gap-1"><i class="fa-solid fa-bolt"></i> Reboot เครื่อง</button>
            </div>
        </div>

        <!-- Device Card 2 -->
        <div class="card-bg rounded-xl p-4 shadow-lg flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-400 inline-block"></span>
                        <h2 class="font-bold text-white text-base">VIP 1</h2>
                    </div>
                    <div class="flex gap-2">
                        <span class="bg-emerald-950 text-emerald-400 text-xs px-2 py-0.5 rounded border border-emerald-800">Tool running</span>
                        <span class="bg-emerald-950 text-emerald-400 text-xs px-2 py-0.5 rounded border border-emerald-800">Online</span>
                    </div>
                </div>

                <div class="relative w-full bg-black rounded-lg overflow-hidden border border-gray-800 aspect-video mb-3 flex items-center justify-center group">
                    <canvas id="canvas-2" class="w-full h-full object-contain"></canvas>
                    <iframe id="iframe-2" class="hidden w-full h-full border-0"></iframe>
                    
                    <div class="absolute top-2 left-2 bg-black/70 text-[10px] text-gray-300 px-2 py-0.5 rounded border border-gray-700">
                        FPS: <span id="fps-2" class="text-emerald-400">30</span>
                    </div>
                    <button onclick="changeSource(2)" class="absolute top-2 right-2 bg-gray-900/80 hover:bg-black text-xs text-gray-300 px-2 py-1 rounded border border-gray-700 opacity-80 hover:opacity-100">
                        <i class="fa-solid fa-link text-cyan-400 mr-1"></i> ตั้งค่า Stream URL
                    </button>
                </div>

                <div class="grid grid-cols-5 gap-1 text-center bg-gray-900/60 p-2 rounded-lg border border-gray-800/80 mb-3 text-xs">
                    <div><div class="text-gray-400 text-[10px]">เวลา</div><div class="font-semibold text-white">1h 45m</div></div>
                    <div><div class="text-gray-400 text-[10px]">Online</div><div class="font-semibold text-emerald-400">4</div></div>
                    <div><div class="text-gray-400 text-[10px]">Offline</div><div class="font-semibold text-gray-400">0</div></div>
                    <div><div class="text-gray-400 text-[10px]">Rejoin</div><div class="font-semibold text-amber-400">5</div></div>
                    <div><div class="text-gray-400 text-[10px]">Hop</div><div class="font-semibold text-cyan-400">0</div></div>
                </div>
            </div>

            <div class="space-y-2 text-xs">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="triggerTool(2, 'Start')" class="btn-blue py-2 rounded font-medium flex items-center justify-center gap-1"><i class="fa-solid fa-play"></i> Start tool</button>
                    <button onclick="triggerTool(2, 'Stop')" class="btn-dark py-2 rounded font-medium flex items-center justify-center gap-1"><i class="fa-solid fa-square"></i> Stop tool</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="triggerTool(2, 'Rejoin')" class="btn-dark py-2 rounded flex items-center justify-center gap-1"><i class="fa-solid fa-arrows-rotate"></i> Rejoin all</button>
                    <button onclick="openCookieModal(2)" class="btn-dark py-2 rounded flex items-center justify-center gap-1"><i class="fa-solid fa-cookie"></i> + Add cookies</button>
                </div>
                <button onclick="triggerTool(2, 'Reboot')" class="w-full btn-red py-2 rounded font-medium flex items-center justify-center gap-1"><i class="fa-solid fa-bolt"></i> Reboot เครื่อง</button>
            </div>
        </div>

    </div>

    <!-- Modal Cookie -->
    <div id="cookieModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 max-w-md w-full space-y-4">
            <h3 class="text-base font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-cookie-bite text-amber-400"></i> เพิ่ม Cookie บัญชี Roblox
            </h3>
            <textarea placeholder="วาง Roblox .ROBLOSECURITY Cookie ที่นี่..." class="w-full h-32 bg-black/60 border border-gray-700 rounded-lg p-3 text-xs text-cyan-300 focus:outline-none focus:border-cyan-500 font-mono"></textarea>
            <div class="flex justify-end gap-2 text-xs">
                <button onclick="closeCookieModal()" class="btn-dark px-4 py-2 rounded">ยกเลิก</button>
                <button onclick="saveCookie()" class="btn-blue px-4 py-2 rounded font-medium">บันทึก Cookie</button>
            </div>
        </div>
    </div>

    <script>
        // Simulation Canvas Animation Logic (สำหรับจำลองหน้าจอฟาร์มเมื่อยังไม่ได้ใส่สตรีมจริง)
        function initCanvasSimulation(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            const ctx = canvas.getContext('2d');
            canvas.width = 400;
            canvas.height = 225;

            let frame = 0;
            function draw() {
                ctx.fillStyle = '#05070a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Grid Lines
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 1;
                for(let x=0; x<canvas.width; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
                for(let y=0; y<canvas.height; y+=30) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

                // Simulated Game Instances
                for(let i=0; i<4; i++) {
                    let rx = (i % 2) * 195 + 10;
                    let ry = Math.floor(i / 2) * 105 + 10;
                    
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(rx, ry, 185, 95);
                    ctx.strokeStyle = '#3b82f6';
                    ctx.strokeRect(rx, ry, 185, 95);

                    // Animated elements
                    ctx.fillStyle = '#22c55e';
                    let posX = rx + 20 + Math.sin((frame + i*20)/15) * 15;
                    ctx.fillRect(posX, ry + 40, 15, 15);

                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '10px monospace';
                    ctx.fillText(`Roblox Bot #${i+1}`, rx + 8, ry + 18);
                    ctx.fillText(`EXP: +${(frame*5 + i*100)%9999}`, rx + 8, ry + 80);
                }

                // Overlay Text
                ctx.fillStyle = 'rgba(0, 242, 254, 0.9)';
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText(`PROCYSIS LIVE STREAM - DEVICE ${id}`, 12, canvas.height - 10);

                frame++;
                requestAnimationFrame(draw);
            }
            draw();
        }

        // Functions & Interactive Controls
        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = text;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        function triggerTool(id, action) {
            showToast(`เครื่อง ${id}: สั่งงาน ${action} สำเร็จ`);
        }

        function batchAction(action) {
            showToast(`สั่งงาน ${action} ทุกเครื่องเรียบร้อยแล้ว`);
        }

        function changeSource(id) {
            const url = prompt(`ใส่ลิงก์ดูจอสด Redfinger / WebRTC Stream สำหรับเครื่อง ${id}:`);
            if(url) {
                const canvas = document.getElementById(`canvas-${id}`);
                const iframe = document.getElementById(`iframe-${id}`);
                iframe.src = url;
                canvas.classList.add('hidden');
                iframe.classList.remove('hidden');
                showToast(`อัปเดตลิงก์ Stream เครื่อง ${id} เรียบร้อยแล้ว`);
            }
        }

        function openCookieModal(id) { document.getElementById('cookieModal').classList.remove('hidden'); }
        function closeCookieModal() { document.getElementById('cookieModal').classList.add('hidden'); }
        function saveCookie() { closeCookieModal(); showToast("บันทึก Cookie เข้าสู่ระบบเรียบร้อยแล้ว"); }

        // Load Canvas on Start
        window.onload = function() {
            initCanvasSimulation(1);
            initCanvasSimulation(2);
        };
    </script>
</body>
</html>
