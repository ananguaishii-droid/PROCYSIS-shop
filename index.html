<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCYSIS SHOP - Cloud Phone Live Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #f1f5f9; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #1e293b; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .title { font-size: 20px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .global-status { font-size: 14px; background: #065f46; color: #34d399; padding: 4px 12px; border-radius: 20px; font-weight: 600; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        .card { background: #1e293b; border-radius: 10px; border: 1px solid #334155; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .device-title { font-weight: bold; font-size: 16px; color: #f8fafc; }
        .badge { font-size: 12px; padding: 3px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .badge-online { background: #059669; color: #ecfdf5; }
        .badge-offline { background: #dc2626; color: #fef2f2; }
        
        /* Display Box สำหรับดูสตรีมเรียลไทม์ */
        .screen-container { position: relative; width: 100%; height: 220px; background: #090d16; border-radius: 6px; border: 1px solid #475569; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .live-stream-img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .screen-placeholder { text-align: center; color: #64748b; font-size: 13px; }
        .fps-counter { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; font-size: 10px; color: #22c55e; }

        /* Control Panel */
        .controls { display: flex; flex-direction: column; gap: 8px; }
        .url-input-box { display: flex; gap: 6px; }
        input[type="text"] { flex: 1; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 6px 10px; border-radius: 4px; font-size: 12px; }
        
        .btn { border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.15s; }
        .btn-set { background: #0284c7; color: white; }
        .btn-start { background: #16a34a; color: white; flex: 1; }
        .btn-stop { background: #dc2626; color: white; flex: 1; }
        .btn-reboot { background: #b91c1c; color: white; width: 100%; margin-top: 4px; }
        .btn:active { transform: scale(0.98); }

        .info-row { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; background: #0f172a; padding: 6px 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">⭐ PROCYSIS SHOP <span>v6.0</span></div>
        <div class="global-status" id="globalOnlineCount">🟢 พร้อมใช้งาน</div>
    </div>

    <div class="grid" id="deviceGrid"></div>

    <script>
        const initialDevices = [
            { id: 1, name: "MINI (หน้ากลาง)" },
            { id: 2, name: "VIP 1" },
            { id: 3, name: "VIP 2" },
            { id: 4, name: "VIP 3" }
        ];

        function loadState(id, key, defaultVal) {
            return localStorage.getItem(`dev_${id}_${key}`) ?? defaultVal;
        }

        function saveState(id, key, val) {
            localStorage.setItem(`dev_${id}_${key}`, val);
        }

        function renderGrid() {
            const grid = document.getElementById('deviceGrid');
            grid.innerHTML = '';

            initialDevices.forEach(dev => {
                const isOnline = loadState(dev.id, 'online', 'true') === 'true';
                const isRunning = loadState(dev.id, 'running', 'false') === 'true';
                const streamUrl = loadState(dev.id, 'streamUrl', '');

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="device-title">🟢 ${dev.name}</span>
                        <span class="badge ${isOnline ? 'badge-online' : 'badge-offline'}" onclick="toggleOnline(${dev.id})">
                            ${isOnline ? 'ONLINE' : 'OFFLINE'}
                        </span>
                    </div>

                    <div class="screen-container">
                        <span class="fps-counter">FPS: ${isOnline ? '30' : '0'}</span>
                        <img id="img_${dev.id}" class="live-stream-img" src="${streamUrl}" style="display: ${streamUrl && isOnline ? 'block' : 'none'};" alt="Live Stream">
                        <div id="ph_${dev.id}" class="screen-placeholder" style="display: ${streamUrl && isOnline ? 'none' : 'block'};">
                            ${!isOnline ? '🔴 เครื่องออฟไลน์อยู่' : (streamUrl ? 'กำลังโหลดภาพสตรีม...' : 'ยังไม่ได้ใส่ Stream / Image URL')}
                        </div>
                    </div>

                    <div class="info-row">
                        <span>สถานะบอท: <b style="color: ${isRunning ? '#4ade80' : '#f87171'}">${isRunning ? 'RUNNING' : 'STOPPED'}</b></span>
                        <span>เวลาสะสม: <b id="timer_${dev.id}">0h 0m</b></span>
                    </div>

                    <div class="controls">
                        <div class="url-input-box">
                            <input type="text" id="url_${dev.id}" value="${streamUrl}" placeholder="วาง Stream / Image URL ตรงนี้">
                            <button class="btn btn-set" onclick="updateStream(${dev.id})">ตั้งค่า URL</button>
                        </div>
                        <div style="display: flex; gap: 6px;">
                            <button class="btn btn-start" onclick="setRunning(${dev.id}, true)">▶ Start Tool</button>
                            <button class="btn btn-stop" onclick="setRunning(${dev.id}, false)">■ Stop Tool</button>
                        </div>
                        <button class="btn btn-reboot" onclick="rebootDevice(${dev.id})">⚡ Reboot เครื่อง</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            updateGlobalStatus();
        }

        function toggleOnline(id) {
            const current = loadState(id, 'online', 'true') === 'true';
            saveState(id, 'online', !current);
            renderGrid();
        }

        function setRunning(id, state) {
            const isOnline = loadState(id, 'online', 'true') === 'true';
            if (!isOnline) {
                alert('เครื่องออฟไลน์อยู่ ไม่สามารถกด Start/Stop ได้!');
                return;
            }
            saveState(id, 'running', state);
            renderGrid();
        }

        function updateStream(id) {
            const val = document.getElementById(`url_${id}`).value.trim();
            saveState(id, 'streamUrl', val);
            renderGrid();
        }

        function rebootDevice(id) {
            if (confirm(`คุณต้องการรีบูตเครื่อง ${id} ใช่หรือไม่?`)) {
                saveState(id, 'running', 'false');
                alert(`กำลังรีบูตเครื่อง ${id}...`);
                renderGrid();
            }
        }

        function updateGlobalStatus() {
            let onlineCount = 0;
            initialDevices.forEach(dev => {
                if (loadState(dev.id, 'online', 'true') === 'true') onlineCount++;
            });
            document.getElementById('globalOnlineCount').innerText = `🟢 ${onlineCount}/${initialDevices.length} เครื่องออนไลน์`;
        }

        renderGrid();
    </script>
</body>
</html>
